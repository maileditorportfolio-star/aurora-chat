<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #07111f; color: #e9f2ff; }
        .card { background: rgba(10, 26, 46, 0.8); border: 1px solid #244362; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-12">
            <h1 class="text-3xl font-bold">Aurora <span class="text-blue-400">Admin</span></h1>
            <div id="auth-status" class="text-sm text-slate-400">Not authenticated</div>
        </header>

        <div id="login-view" class="max-w-md mx-auto card p-8 rounded-2xl">
            <h2 class="text-xl mb-6">Admin Login</h2>
            <form id="login-form" class="space-y-4">
                <input type="email" id="email" placeholder="Admin Email" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 outline-none focus:border-blue-500" required>
                <input type="password" id="password" placeholder="Password" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 outline-none focus:border-blue-500" required>
                <button type="submit" class="w-full p-3 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-xl transition">Login</button>
            </form>
        </div>

        <div id="dashboard-view" class="hidden space-y-8">
            <div class="grid grid-cols-4 gap-6">
                <div class="card p-6 rounded-2xl">
                    <p class="text-slate-400 text-sm uppercase mb-1">Total Users</p>
                    <p id="stat-users" class="text-3xl font-bold">-</p>
                </div>
                <div class="card p-6 rounded-2xl">
                    <p class="text-slate-400 text-sm uppercase mb-1">Blocked</p>
                    <p id="stat-blocked" class="text-3xl font-bold">-</p>
                </div>
                <div class="card p-6 rounded-2xl">
                    <p class="text-slate-400 text-sm uppercase mb-1">Messages</p>
                    <p id="stat-messages" class="text-3xl font-bold">-</p>
                </div>
                <div class="card p-6 rounded-2xl">
                    <p class="text-slate-400 text-sm uppercase mb-1">Support Tickets</p>
                    <p id="stat-tickets" class="text-3xl font-bold">-</p>
                </div>
            </div>

            <div class="card p-8 rounded-2xl overflow-hidden">
                <h3 class="text-xl mb-6">Recent Users (Email Access)</h3>
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-slate-400 border-b border-slate-800">
                            <th class="pb-4">Name</th>
                            <th class="pb-4">Email</th>
                            <th class="pb-4">Short ID</th>
                            <th class="pb-4">Reports</th>
                            <th class="pb-4">Status</th>
                        </tr>
                    </thead>
                    <tbody id="user-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const api = '/api/admin';
        let token = localStorage.getItem('aurora_admin_token');

        const show = (id) => document.getElementById(id).classList.remove('hidden');
        const hide = (id) => document.getElementById(id).classList.add('hidden');

        async function fetchStats() {
            const r = await fetch(`${api}/stats`, { headers: { 'Authorization': `Bearer ${token}` } });
            const d = await r.json();
            if (d.success) {
                document.getElementById('stat-users').innerText = d.data.total_users;
                document.getElementById('stat-blocked').innerText = d.data.blocked_users;
                document.getElementById('stat-messages').innerText = d.data.total_messages;
                document.getElementById('stat-tickets').innerText = d.data.open_submissions;
            }
        }

        async function fetchUsers() {
            const r = await fetch(`${api}/emails`, { headers: { 'Authorization': `Bearer ${token}` } });
            const d = await r.json();
            if (d.success) {
                const list = document.getElementById('user-list');
                list.innerHTML = d.data.map(u => `
                    <tr class="border-b border-slate-800/50">
                        <td class="py-4 font-medium">${u.name}</td>
                        <td class="py-4 text-slate-300">${u.email}</td>
                        <td class="py-4 text-blue-400 font-mono">${u.short_id}</td>
                        <td class="py-4">${u.report_count}</td>
                        <td class="py-4">
                            <span class="px-2 py-1 rounded text-xs ${u.is_blocked ? 'bg-red-900/50 text-red-300' : 'bg-green-900/50 text-green-300'}">
                                ${u.is_blocked ? 'Blocked' : 'Active'}
                            </span>
                        </td>
                    </tr>
                `).join('');
            }
        }

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const r = await fetch(`${api}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const d = await r.json();
            if (d.success) {
                token = d.data.token;
                localStorage.setItem('aurora_admin_token', token);
                location.reload();
            } else {
                alert('Login failed');
            }
        };

        if (token) {
            hide('login-view');
            show('dashboard-view');
            document.getElementById('auth-status').innerText = 'Authenticated Admin';
            fetchStats();
            fetchUsers();
        }
    </script>
</body>
</html>
